<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enquiry - Sweet Treats by Abigail</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #fef5f9;
            color: #333;
            line-height: 1.6;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 0 20px;
        }
        .site-header {
            background: linear-gradient(135deg, #d4a5d9 0%, #f5c6e1 100%);
            padding: 30px 0;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .site-title {
            color: #fff;
            text-align: center;
            margin-bottom: 20px;
            font-size: 2.5em;
        }
        .main-nav {
            display: flex;
            justify-content: center;
            gap: 30px;
            flex-wrap: wrap;
            font-family: Georgia, 'Times New Roman', Times, serif;
        }
        .main-nav a {
            color: #fff;
            text-decoration: none;
            font-weight: 500;
            transition: opacity 0.3s;
        }
        .main-nav a:hover {
            opacity: 0.8;
        }
        main {
            padding: 40px 0;
        }
        main h2 {
            color: #d4a5d9;
            margin-bottom: 20px;
            font-size: 2em;
        }
        form {
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            max-width: 600px;
        }
        form label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
            font-weight: 500;
            color: #d4a5d9;
        }
        form input, form textarea, form select {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-family: inherit;
        }
        form textarea {
            resize: vertical;
            min-height: 120px;
        }
        form button {
            background: #d4a5d9;
            color: #fff;
            padding: 12px 30px;
            border: none;
            border-radius: 4px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
        }
        form button:hover {
            background: #c190c4;
        }
        .site-footer {
            background: #d4a5d9;
            color: #fff;
            text-align: center;
            padding: 20px 0;
            margin-top: 40px;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <header class="site-header">
        <div class="container">
            <h1 class="site-title">Sweet Treats by Abigail</h1>
            <nav class="main-nav">
                <a href="../index.html">Home</a>
                <a href="about.html">About</a>
                <a href="products.html">Products</a>
                <a href="enquiry.html">Enquiry</a>
                <a href="contact.html">Contact</a>
            </nav>
        </div>
    </header>

    <main class="container">
        <h2>Make an Enquiry</h2>
        <form>
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required>
            
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>
            
            <label for="product">Product of Interest:</label>
            <select id="product" name="product">
                <option>Custom Cakes</option>
                <option>Bento Cake Boxes</option>
                <option>Mini Cakes</option>
                <option>Tarts</option>
                <option>Puddings</option>
                <option>Loaf Cakes</option>
                <option>Cupcakes</option>
                <option>Dessert Cakes</option>
            </select>
            
            <label for="message">Message:</label>
            <textarea id="message" name="message" required></textarea>
            
            <button type="submit">Send Enquiry</button>
        </form>
    </main>

    <footer class="site-footer">
        <div class="container">&copy; 2026 Sweet Treats by Abigail</div>
    </footer>
</body>
</html>
